experiment:
  name: dyck_counter_task_a_clean_short
  task: dyck
  seeds:
  - 0
task:
  dyck_pairs: 24
  total_length: 48
  seq_len: 48
  repeat_prob: 1.0
  num_noise_tokens: 4
  n_tasks: 512
  prefix_probe_max_len: 48
training:
  steps: 15000
  batch_size: 128
  optimizer: adamw
  learning_rate: 0.0003
  checkpoint_steps: []
models:
- name: transformer
  layers: 3
  emb_dim: 128
  hidden_dim: 128
  n_heads: 4
  ffn_dim: 512
  dropout: 0.0
  max_positions: 2048
  state_kind: h
analysis:
  extract_layers: all
  extract_positions: all
  extract_checkpoints:
  - final
  probes:
    ridge_targets:
    - left
    - right
    - height
    logistic_targets:
    - height_class
    - left_right_class
    - legal_next_class
    balance_by: height
  geometry:
    check_height_equals_left_minus_right: true
