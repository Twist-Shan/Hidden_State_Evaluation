experiment:
  name: dyck_counter_task_b_noisy_short_5k
  task: dyck
  seeds:
  - 0

task:
  dyck_pairs: 24
  total_length: 48
  seq_len: 120
  repeat_prob: 0.5
  num_noise_tokens: 16
  n_tasks: 512
  prefix_probe_max_len: 48

training:
  steps: 5000
  batch_size: 128
  optimizer: adamw
  learning_rate: 0.0003
  eval_every: 100
  checkpoint_steps:
  - 0
  - 1000
  - 2000
  - 5000

models:
- name: transformer
  layers: 3
  emb_dim: 128
  hidden_dim: 128
  n_heads: 4
  ffn_dim: 512
  dropout: 0.0
  max_positions: 2048
  state_kind: h

analysis:
  extract_layers: all
  extract_positions: all
  extract_checkpoints: training_checkpoint_steps
  probes:
    ridge_targets:
    - left
    - right
    - height
    logistic_targets:
    - height_class
    - left_right_class
    - legal_next_class
    balance_by: height
  geometry:
    check_height_equals_left_minus_right: true
